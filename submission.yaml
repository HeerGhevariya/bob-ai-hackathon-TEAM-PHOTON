submission:
  title: "TrialGuard AI — Clinical Trial Risk Monitor & Protocol Deviation Detector"

  problem_statement: >
    Clinical trials with 5,000+ patient visits across 200+ sites face a critical
    compliance gap: protocol deviations — missed visits, wrong dosing, banned
    co-medications — go undetected until the FDA audit. A single rejected
    submission delays drug approval by 6–12 months and costs $50–100M. Risk
    managers today rely on periodic manual sampling with no real-time cross-site
    visibility, making systemic problems invisible until it's too late.

  solution_summary: >
    TrialGuard AI is a Bob-integrated MCP server that continuously compares
    patient records against the protocol specification, classifies each deviation
    by ICH E6 GCP severity (major/minor/administrative), scores site-level risk
    using composite leading indicators, and generates CAPA-ready reports with
    recommended mitigations. Every finding is deterministic and fully auditable —
    the AI writes up findings in clear language, but never decides what counts
    as a deviation.

  key_features:
    - "Real-time protocol deviation detection across 200+ clinical trial sites via rule-based engine"
    - "ICH E6(R2) GCP severity classification (Major/Minor/Administrative) with auditable rule tracing"
    - "Composite site-level risk scoring using severity weighting, trend detection, repetition analysis, and recency bias"
    - "CAPA-ready regulatory report generation with root cause analysis and recommended corrective/preventive actions"
    - "IBM Bob MCP integration — 5 tools, 2 resources, 2 prompts for conversational trial monitoring"

  tech_stack:
    languages: ["Python", "JavaScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: ["IBM Bob (MCP Server integration)"]
    databases: []
    other: ["MCP Python SDK v2", "Recharts", "React Router", "Uvicorn"]

  what_we_are_most_proud_of: >
    The deterministic, rule-based analysis engine. In a regulated environment,
    "the AI said so" is not an acceptable answer to an auditor. Every deviation
    finding traces back to an exact protocol rule and exact patient record.
    The AI (via Bob) is used only to present findings conversationally — it
    never decides what counts as a deviation, how severe it is, or what the
    risk score is. This makes the system trustworthy enough for actual
    regulatory use, not just a hackathon demo.

  known_limitations: >
    Uses synthetic data (no real patient records for privacy/compliance reasons).
    The CAPA report generation uses deterministic templates rather than LLM-generated
    narratives (watsonx.ai integration was planned but not implemented due to API
    access constraints). The dashboard is not deployed — runs locally only.
    Risk scoring thresholds are illustrative and would need calibration with
    real trial data before production use.

